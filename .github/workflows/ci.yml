name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  package-tests:
    name: swift test (TickrKit)
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Bağımlılıkları çöz
        working-directory: Packages/TickrKit
        run: swift package resolve

      - name: Test
        working-directory: Packages/TickrKit
        run: swift test

  app-tests:
    name: xcodebuild test (Tickr)
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      # Simülatörü isimle aramak kırılgan: imajdaki Xcode yükseldiğinde
      # "iPhone 16" en yeni iOS runtime'ında bulunmayabiliyor ve xcodebuild
      # exit 70 ile düşüyor. Onun yerine mevcut cihazlardan birini seçip
      # UDID ile hedefliyoruz, üstelik testten önce boot ederek.
      - name: Simülatör seç
        id: sim
        run: |
          python3 - > simulator.txt <<'PY'
          import json, subprocess, sys

          data = json.loads(subprocess.run(
              ["xcrun", "simctl", "list", "devices", "available", "-j"],
              capture_output=True, text=True, check=True).stdout)

          def version(runtime):
              digits = runtime.rsplit(".iOS-", 1)[-1].split("-")
              return [int(d) if d.isdigit() else 0 for d in digits]

          best = None
          for runtime, devices in data["devices"].items():
              if ".iOS-" not in runtime:
                  continue
              for device in devices:
                  if not device.get("isAvailable") or not device["name"].startswith("iPhone"):
                      continue
                  key = (version(runtime), device["name"])
                  if best is None or key > best[0]:
                      best = (key, device)

          if best is None:
              sys.exit("Kullanılabilir iPhone simülatörü yok")

          print(best[1]["udid"], best[1]["name"])
          PY
          read -r UDID NAME < simulator.txt
          echo "Seçilen simülatör: $NAME ($UDID)"
          echo "udid=$UDID" >> "$GITHUB_OUTPUT"

      - name: Simülatörü başlat
        run: |
          # Zaten açıksa boot hata döner, önemsiz. Boot tamamlanmasa bile
          # işi burada düşürmüyoruz: asıl karar xcodebuild'in.
          xcrun simctl boot "${{ steps.sim.outputs.udid }}" || true
          xcrun simctl bootstatus "${{ steps.sim.outputs.udid }}" -b || true

      - name: Test
        run: |
          set -o pipefail
          # xcbeautify runner imajında kurulu; olmazsa ham çıktıyla devam et.
          FORMATTER=cat
          command -v xcbeautify >/dev/null && FORMATTER=xcbeautify
          xcodebuild test \
            -project Tickr.xcodeproj \
            -scheme Tickr \
            -destination "id=${{ steps.sim.outputs.udid }}" \
            -resultBundlePath TestResults.xcresult \
            CODE_SIGNING_ALLOWED=NO \
            | $FORMATTER

      - name: Test sonuçlarını yükle
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: TestResults
          path: TestResults.xcresult
